<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WizLeery — Q3 2026 Visual Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ============ Q3 2026 — V7 ============ */
:root{
  --bg-page:#0A0A0A;
  --bg-device:#111111;
  --text-primary:#FFFFFF;
  --text-secondary:rgba(255,255,255,0.6);
  --text-muted:rgba(255,255,255,0.35);
  --border-dark:rgba(255,255,255,0.08);
  --accent-purple:#7C3AED;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.6;
}
img{
  image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;
  filter:none !important;
}
[hidden]{display:none !important}

/* ============ FEATURED ============ */
.featured{height:auto;min-height:100vh;position:relative;overflow:hidden}
.corner{position:absolute;z-index:6;font-size:12px;letter-spacing:0.2em;text-transform:uppercase}
.corner-tl{top:32px;left:40px;color:var(--text-secondary);font-weight:600;line-height:1.7}
.corner-tr{top:32px;right:40px;color:var(--text-muted)}
.accent{color:var(--accent-purple)}
.featured-stage{
  position:relative;
  height:calc(48.75vw + 14px + max(calc(48vh - 24.375vw - 7px), 64px)); /* 组合总高=上边距+样机高, 首屏随内容长高, 不裁底部、不压第二屏 */
}
.featured-slide{
  position:absolute;inset:0;
  display:flex;align-items:flex-start;justify-content:center;
}

/* ============ DEVICES ============ */
.laptop{width:720px;max-width:60vw;position:relative;z-index:1;cursor:pointer;flex-shrink:0}
.laptop .screen{aspect-ratio:16/10;border-radius:12px 12px 0 0;background:var(--bg-device);padding:10px 10px 0;overflow:hidden}
.laptop::after{content:'';display:block;height:14px;width:112%;margin-left:-6%;background:#1A1A1A;border-radius:0 0 10px 10px}
.phone{
  width:280px;aspect-ratio:9/19.5;border-radius:36px;background:var(--bg-device);
  padding:8px;position:relative;z-index:2;cursor:pointer;flex-shrink:0;
}
.phone::before{
  content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:90px;height:22px;border-radius:0 0 14px 14px;background:var(--bg-device);z-index:2;
}
.phone .screen{width:100%;height:100%;border-radius:28px;overflow:hidden;padding:0}
.screen img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.featured .combo{
  position:relative;
  height:calc(48.75vw + 14px);            /* 电脑: 宽 78vw、16:10 屏 + 底座 14px */
  width:92.4vw;                            /* 电脑 78vw + 手机 18vw 交叠 20% */
  margin-top:max(calc(48vh - 24.375vw - 7px), 64px); /* 垂直中心约 48vh, 顶部留 64px 给四角信息 */
}
.featured .combo .laptop{position:absolute;right:0;top:0;width:78vw;max-width:none;z-index:1}
.featured .combo .phone{position:absolute;left:0;bottom:0;width:18vw;z-index:2}
.phone:hover .screen img,.item:hover img{filter:brightness(1.05) !important}

/* ============ SELECTED ============ */
.label{text-align:center;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted)}
#selected{padding:140px 0 120px}
#selected .label{margin-bottom:56px}
.ring-stage{position:relative;height:680px;perspective:1600px;margin-top:24px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.ring-stage:active{cursor:grabbing}
.ring .phone img{pointer-events:none}
.ring{
  position:absolute;left:50%;top:50%;width:0;height:0;
  transform-style:preserve-3d;
  will-change:transform;
}
.ring .phone{
  position:absolute;left:-122.5px;top:-265px;
  width:245px;
  transform:translate3d(var(--x,0px), var(--y,0px), var(--z,0px));
}
@media (max-width:1200px){
  .ring-stage{transform:scale(0.85)}
}

/* ============ ARCHIVE ============ */
#archive{padding:120px 32px 160px}
#archive .label{margin-bottom:56px}
.masonry{columns:5;column-gap:16px;max-width:1800px;margin:0 auto}
.masonry .item{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:16px;cursor:pointer}
.masonry img{width:100%;height:auto;display:block;border-radius:8px;margin-bottom:8px}
.cap{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;text-align:center;color:var(--text-muted)}

/* ============ LIGHTBOX ============ */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100}
.lb-scroll{width:100%;height:100%;overflow:auto;display:flex;flex-direction:column;padding:48px 0;cursor:grab}
.lightbox img{max-width:90vw;width:auto;height:auto;margin:auto;display:block}
.lb-close{position:absolute;top:24px;right:32px;font-size:24px;line-height:1;color:var(--text-secondary);background:none;border:none;cursor:pointer;z-index:5;padding:8px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;color:var(--text-secondary);background:none;border:none;cursor:pointer;padding:16px;z-index:5}
.lb-prev{left:20px}
.lb-next{right:20px}
.lb-meta{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:18px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);z-index:5}
body.lb-open{overflow:hidden}

/* ============ RESPONSIVE ============ */
@media (max-width:1024px){
  .masonry{columns:3}
}
@media (max-width:768px){
  .corner{font-size:10px}
  .corner-tl{top:16px;left:16px}
  .corner-tr{top:16px;right:16px}
  .featured{height:auto;min-height:100vh}
  .featured-stage{position:relative;height:calc(100vh - 96px)}
  .featured .combo{height:auto;width:90vw;margin-top:56px}
  .featured .combo .laptop{position:relative;right:auto;top:auto;width:90vw;max-width:none}
  .featured .combo .phone{position:relative;left:auto;bottom:auto;width:170px;margin:20px auto 0}
  .ring-stage{perspective:none;height:auto;transform:none;margin-top:0;overflow:visible}
  .ring{position:static;width:auto;height:100%;transform:none !important;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px}
  .ring .phone{position:static;transform:none !important;width:100%;max-width:245px;justify-self:center}
  .ring .phone[data-copy]:not([data-copy="1"]){display:none !important}
  .masonry{columns:2}
}
@media (max-height:840px){
  .featured .combo{transform:scale(0.85)}
}
</style>
</head>
<body>

<!-- ============ SCREEN 1 · FEATURED ============ -->
<section class="featured" id="featured">
  <div class="corner corner-tl">WIZLEERY<br>Q3 2026</div>

</section>

<!-- ============ SCREEN 2 · SELECTED ============ -->
<section id="selected">

<!-- ============ LIGHTBOX ============ -->

    p.style.setProperty('--x', (p.dataset.j * pitch)+'px');
  });

    ringPhones.push(p);
  }
});

  const dt = Math.min(0.1, (now - ringLast)/1000);
  ringLast = now;
  if(!ringPaused) ringX = (ringX + LOOP()*dt/40) % LOOP();  /* 40s 一组无缝循环 */
  ring.style.transform = 'translateX(' + (-ringX) + 'px)';
  requestAnimationFrame(ringTick);
}
requestAnimationFrame(ringTick);
ringStage.addEventListener('mouseenter', ()=>{ ringPaused = true; });
ringStage.addEventListener('mouseleave', ()=>{ ringPaused = false; });
/* 鼠标拖拽左右滑动 */
let dragging = false, dragMoved = 0, lastX = 0;
ringStage.addEventListener('pointerdown', e=>{
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  dragging = true; dragMoved = 0; lastX = e.clientX;
  ringPaused = true;
  ringStage.setPointerCapture(e.pointerId);
});
ringStage.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  dragMoved += Math.abs(dx);
  ringX = (ringX - dx + LOOP()*4) % LOOP();
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  if(dragMoved > 5) suppressClick = true;   /* 拖拽后吞掉误触的 click */
  ringPaused = !ringStage.matches(':hover');
}
ringStage.addEventListener('pointerup', endDrag);
ringStage.addEventListener('pointercancel', endDrag);

/* ---------- build archive masonry ---------- */
const masonry = document.getElementById('masonry');
ARCHIVE.forEach((name,k)=>{
  const idx = 8 + k;
  const item = document.createElement('div');
  item.className = 'item';
  item.dataset.open = idx;
  item.innerHTML = '<img src="images/'+coverOf(name)+'" alt="'+name+'" loading="lazy"><div class="cap">'+name.toUpperCase()+'</div>';
  masonry.appendChild(item);
});

/* ---------- lightbox ---------- */
const lb = document.getElementById('lightbox');
const lbScroll = document.getElementById('lbScroll');
const lbCounter = document.getElementById('lbCounter');
const lbName = document.getElementById('lbName');
let cur = 0, zoom = 1, lbImgs = [];
function openLB(i){
  cur = i;
  const srcs = lbList(IMAGES[i]);
  lbScroll.innerHTML = '';
  srcs.forEach(s=>{
    const im = document.createElement('img');
    im.src = 'images/'+s;
    im.alt = s;
    lbScroll.appendChild(im);
  });
  lbImgs = lbScroll.querySelectorAll('img');
  zoom = 1;
  lbImgs.forEach(im=>{ im.style.width = ''; im.style.maxWidth = ''; });
  lbScroll.scrollTop = 0; lbScroll.scrollLeft = 0;
  lbCounter.textContent = String(i+1).padStart(2,'0') + ' / ' + IMAGES.length;
  lbName.textContent = IMAGES[i].toUpperCase();
  lb.hidden = false;
  document.body.classList.add('lb-open');
}
function closeLB(){ lb.hidden = true; document.body.classList.remove('lb-open'); }
function step(d){ openLB((cur + d + IMAGES.length) % IMAGES.length); }
let suppressClick = false;
document.addEventListener('click', e=>{
  if(suppressClick){ suppressClick = false; return; }
  const t = e.target.closest('[data-open]');
  if(t) openLB(+t.dataset.open);
});
document.getElementById('lbClose').addEventListener('click', closeLB);
document.getElementById('lbPrev').addEventListener('click', e=>{ e.stopPropagation(); step(-1); });
document.getElementById('lbNext').addEventListener('click', e=>{ e.stopPropagation(); step(1); });
lb.addEventListener('click', e=>{ if(e.target === lb || e.target === lbScroll) closeLB(); });
document.addEventListener('keydown', e=>{
  if(lb.hidden) return;
  if(e.key === 'Escape') closeLB();
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});
lb.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = (e.deltaY < 0) ? 1.15 : (1/1.15);
  zoom = Math.min(6, Math.max(0.4, zoom * factor));
  lbImgs.forEach(im=>{
    im.style.width = (im.offsetWidth * factor) + 'px';
    im.style.maxWidth = 'none';
  });
}, {passive:false});
let panning = false, px = 0, py = 0;
lbScroll.addEventListener('mousedown', e=>{
  if(e.target === lbScroll) return;
  panning = true; px = e.clientX; py = e.clientY;
  e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if(!panning) return;
  lbScroll.scrollLeft -= (e.clientX - px);
  lbScroll.scrollTop -= (e.clientY - py);
  px = e.clientX; py = e.clientY;
});
window.addEventListener('mouseup', ()=>{ panning = false; });
</script>
